name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: colcon build and test (ROS 2 Jazzy)
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base

    steps:
      - uses: actions/checkout@v4
        with:
          path: src/localizability-recovery

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3-colcon-common-extensions python3-pip
          rosdep update --rosdistro jazzy
          rosdep install -y --ignore-src \
            --from-paths src/localizability-recovery/locrec \
                         src/localizability-recovery/locrec_core \
                         src/localizability-recovery/locrec_estimator \
                         src/localizability-recovery/locrec_msgs
          # no rosdep keys for these two; the C++ build fetches small_gicp itself
          pip install --break-system-packages mujoco small-gicp pillow

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # Eigen leaves a default-constructed matrix uninitialised; filling it with NaN here makes
          # any read before write fail the tests instead of passing on whatever was in memory
          colcon build --packages-select locrec locrec_msgs locrec_core locrec_estimator \
            --cmake-args -DCMAKE_CXX_FLAGS=-DEIGEN_INITIALIZE_MATRICES_BY_NAN

      - name: C++ tests
        shell: bash
        run: |
          source install/setup.bash
          colcon test --packages-select locrec_core locrec_estimator \
            --event-handlers console_direct+
          colcon test-result --all --verbose

      - name: Python tests
        shell: bash
        run: |
          source install/setup.bash
          cd src/localizability-recovery
          # the ROS pytest plugins use a hook argument pytest 9 removed, and none of
          # these tests needs them
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest \
            locrec/test locrec_ros/test/test_conversions.py locrec_ros/test/test_render.py -q

  lint:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8
      - run: flake8

# locrec_ros/test/test_live_view.py is left out: it checks the viewer against the running
# graph and the rviz layouts, which needs the whole workspace and a simulator. The GPU
# renderer's cases skip themselves wherever no EGL context can be made, runners included.
